# ==============================================================================
# v0.1.0-dev-alpha
# PIPELINE CD: FRONTEND ZYVENCORE VALENTINE
# Propósito: compilar y publicar en Azure Static Web Apps.
# Se dispara EXCLUSIVAMENTE tras un merge (o push) a ramas principales.
# ==============================================================================
trigger:
  branches:
    include:
      - develop
      - staging
      - main
      - fixci # <- Incluimos tu rama para poder depurar

pr: none

pool:
  vmImage: 'ubuntu-latest'

# Inyectamos el grupo DIRECTAMENTE en la raíz. 
# Esto evita el error de "grupo vacío" en tiempo de compilación.
variables:
  - ${{ if eq(variables['Build.SourceBranchName'], 'develop') }}:
    - group: 'VG-ZV-DEV'
  - ${{ if eq(variables['Build.SourceBranchName'], 'staging') }}:
    - group: 'VG-ZV-STG'
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    - group: 'VG-ZV-MAIN'
  - ${{ if eq(variables['Build.SourceBranchName'], 'fixci') }}:
    - group: 'VG-ZV-DEV' # <- Usamos el grupo DEV para probar en tu rama

stages:
  - stage: Deploy_Web
    displayName: 'Despliegue a Azure Static Web Apps'
    jobs:
      - job: Compilar_y_Desplegar
        # IMPORTANTE: Se eliminó el bloque 'variables' que estaba aquí adentro.

        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '24.x'
            displayName: 'Instalar Node.js 24'

          - script: npm ci
            displayName: 'Instalar dependencias exactas'

          - script: npm run test
            displayName: 'Puerta previa: pruebas unitarias (Vitest)'

          - script: npm run build
            displayName: 'Compilar el bundle de producción'
            env:
              VITE_API_BASE_URL: $(DEPLOYED_BACKEND)

          - task: AzureStaticWebApp@0
            displayName: 'CD: Publicar en Azure SWA'
            inputs:
              app_location: '/'
              output_location: 'dist'
              skip_app_build: true 
              skip_api_build: true 
              azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)