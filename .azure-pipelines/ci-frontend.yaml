# ==============================================================================
# PIPELINE CI: FRONTEND ZYVENCORE VALENTINE
# Propósito: compuerta de calidad pre-merge (ESLint, Vitest y compilación).
# Se dispara EXCLUSIVAMENTE cuando se abre un Pull Request hacia ramas principales.
#
# No carga ningún variable group, y es deliberado: una compuerta de calidad no
# necesita secretos. `npm run build` compila igual con o sin la URL del backend
# —esa se inyecta al desplegar—, así que pedir aquí un grupo de variables solo
# añadiría una forma de que el CI falle por algo que no es la calidad del código.
# ==============================================================================
trigger: none

pr:
  branches:
    include:
      - develop
      - staging
      - main

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: Validar_Frontend
    displayName: 'Quality Gate: React & Vite'

    steps:
      # vitest@5 declara `engines: ^22.12 || ^24 || >=26`. Con la 20 el paso de
      # pruebas no arranca; la 24 es además la que se usa en desarrollo.
      - task: NodeTool@0
        inputs:
          versionSpec: '24.x'
        displayName: 'Instalar Node.js 24'

      - script: npm ci
        displayName: 'Instalar dependencias exactas'

      # No es redundante con el build: las reglas de react-hooks (leer un ref
      # durante el render, dependencias de efectos) no son errores de tipo y
      # `tsc -b` las deja pasar sin decir nada.
      - script: npm run lint
        displayName: 'Quality Gate: ESLint'

      - script: npm run test
        displayName: 'Quality Gate: Pruebas unitarias (Vitest)'

      - script: npm run build
        displayName: 'Quality Gate: Compilación (tsc + vite)'
