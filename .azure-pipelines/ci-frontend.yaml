# ==============================================================================
# CI · COMPUERTA DE CALIDAD (Pull Requests)
# ------------------------------------------------------------------------------
# Se ejecuta SOLO cuando se abre o actualiza un Pull Request hacia develop,
# staging o main. No despliega nada y no carga ningún Variable Group: una
# compuerta de calidad no necesita secretos. `npm run build` compila igual sin
# la URL del backend (esa se inyecta únicamente al desplegar).
#
# Requisito en Azure DevOps: el repositorio vive en GitHub, así que el bloque
# `pr:` es lo que dispara este pipeline. Si el repo estuviera en Azure Repos,
# habría que crear además una Branch Policy > Build Validation por rama.
# ==============================================================================

trigger: none   # Nunca por push. Eso es trabajo del CD.

pr:
  branches:
    include:
      - develop
      - staging
      - main

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: Quality_Gate
    displayName: 'Quality Gate · React + Vite'
    steps:
      # vitest@5 declara engines ^22.12 || ^24 || >=26. Con Node 20 el paso
      # de pruebas ni arranca. La 24 es además la usada en desarrollo.
      - task: NodeTool@0
        displayName: 'Node.js 24'
        inputs:
          versionSpec: '24.x'

      - script: npm ci
        displayName: 'npm ci'

      - script: npm run lint
        displayName: 'ESLint'

      - script: npm run test
        displayName: 'Vitest'

      - script: npm run build
        displayName: 'Build de prueba (tsc + vite)'
