<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      El icono es SOLO el monograma, recortado del logo: el nombre completo a
      16 px es una mancha gris y encima deja la marca mas pequena todavia.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eternal Dedications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Great+Vibes&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <!--
      Meta Pixel sin JavaScript. Es la única parte del Pixel que vive en el HTML,
      porque es la única que no puede vivir en React: si el navegador no ejecuta
      scripts, la app no se monta. El resto (init, PageView y navegación interna)
      está en src/components/analytics/MetaPixel.tsx, y el identificador se
      configura en src/config/analytics.ts (VITE_META_PIXEL_ID).
    -->
    <noscript>
      <img height="1" width="1" style="display:none" alt=""
        src="https://www.facebook.com/tr?id=4659139844407745&amp;ev=PageView&amp;noscript=1" />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
